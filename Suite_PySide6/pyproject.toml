[project]
name = "suite-rodriguez-finura-pyside6"
version = "1.6.5"
description = "Suite Rodriguez Finura profesional en PySide6."
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "openpyxl>=3.1",
    "pandas>=2.2",
]

[project.scripts]
suite-pyside6 = "suite_pyside6.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
